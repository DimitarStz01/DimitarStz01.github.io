<!doctype html><html lang="bg"><head><meta charset="utf-8"><meta name="robots" content="noindex,follow"><title>Magimil layout QA</title><style>body{font:14px/1.6 monospace;background:#eff3f3;color:#183a40;padding:20px}iframe{position:absolute;left:0;top:300px;height:900px;border:0;opacity:.01;pointer-events:none}pre{white-space:pre-wrap}</style></head><body><h1>Layout QA</h1><pre id="results">Checking…</pre><iframe id="frame" title="Test viewport"></iframe><script>
(async()=>{const output=document.getElementById('results');const frame=document.getElementById('frame');const results=[];for(const width of [320,390,768,1440]){for(const page of ['../index.html?theme=dark','../index.html?theme=light','../montazh/index.html?theme=dark','../montazh/index.html?theme=light']){frame.style.width=width+'px';await new Promise(resolve=>{frame.onload=resolve;frame.src=page});const doc=frame.contentDocument;await doc.fonts.ready;await new Promise(requestAnimationFrame);const overflow=doc.documentElement.scrollWidth-width;const loaded=[...doc.images].filter(i=>i.getAttribute('src')&&i.loading!=='lazy').every(i=>i.complete&&i.naturalWidth>0);results.push({width,page,scrollWidth:doc.documentElement.scrollWidth,pass:overflow<=1&&loaded,imagesLoaded:loaded});output.textContent=JSON.stringify(results,null,2);}}output.textContent='COMPLETE\n'+JSON.stringify(results,null,2);frame.remove();})();
</script></body></html>
