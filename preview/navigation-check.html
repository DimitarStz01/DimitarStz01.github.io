<!doctype html><html><head><meta charset="utf-8"><meta name="robots" content="noindex"><title>Проверка на навигацията</title><style>body{background:#202124;color:#fff;font:14px sans-serif}iframe{border:1px solid #555;height:760px;width:390px}pre{white-space:pre-wrap}</style></head><body><pre id="result">Проверка…</pre><iframe id="frame" title="Мобилен преглед"></iframe><script>
(async()=>{const f=document.querySelector('iframe'),results=[];const pages=['index.html','zagotovki-ot-lamarina/index.html','ogavane-na-lamarina-abkant/index.html','bezshevni-uluci/index.html','shlebah/index.html','metalen-hantar/index.html','lameli-za-ograda/index.html','vodostochni-trabi-i-detayli/index.html','montazh/index.html'];for(const width of [320,390,1440])for(const page of pages){f.style.width=width+'px';await new Promise(resolve=>{f.onload=resolve;f.src='../'+page+'?theme=dark'});const w=f.contentWindow,d=f.contentDocument;await d.fonts.ready;w.scrollTo({top:1500,behavior:"instant"});await new Promise(w.requestAnimationFrame.bind(w));const h=d.querySelector('.site-header').getBoundingClientRect();const badge=/ил[лю]*юстративен кадър|оборудването от визитката/i.test(d.body.innerText);let menu=true;if(width<850){d.querySelector('.menu-button').click();menu=Math.abs(d.querySelector('.main-nav').getBoundingClientRect().top-h.bottom)<=1;d.querySelector('.menu-button').click()}results.push({page,width,headerTop:h.top,headerHeight:h.height,overflow:d.documentElement.scrollWidth>width,labels:badge,menu,pass:Math.abs(h.top)<1&&h.height<=81&&!badge&&menu&&d.documentElement.scrollWidth<=width&&d.documentElement.dataset.theme==='dark'});}document.querySelector('#result').textContent=JSON.stringify({complete:true,passed:results.filter(x=>x.pass).length,total:results.length,failures:results.filter(x=>!x.pass)},null,2);f.style.width='390px';await new Promise(resolve=>{f.onload=resolve;f.src='../index.html?theme=dark#detayli'});})();
</script></body></html>
